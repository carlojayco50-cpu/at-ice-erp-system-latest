# Single origin for the whole app (https://www.atice.cloud):
#   /            React SPA (client-side routing -> index.html)
#   /api, /up    Laravel via FastCGI to the backend container
#   /storage     uploaded delivery-proof photos (shared volume, read-only)
# TLS is terminated by the reverse proxy in front of this container.

# The reverse proxy tells us the original scheme; Laravel sees HTTPS=on and builds https URLs.
map $http_x_forwarded_proto $fastcgi_https {
    default "";
    https   on;
}

# Canonical host is www.atice.cloud; the bare domain redirects permanently.
server {
    listen 80;
    server_name atice.cloud;
    server_tokens off;
    return 301 https://www.atice.cloud$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 12m;

    # Real client IP from Traefik, so Laravel's per-IP rate limits (login,
    # kiosk) see each user instead of one shared proxy address.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Docker's embedded DNS; resolving at request time lets nginx start even
    # if the backend container is still booting.
    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ ^/(api|up)(/|$) {
        set $php_upstream backend:9000;
        fastcgi_pass $php_upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/html/public;
        fastcgi_param HTTPS           $fastcgi_https if_not_empty;
        fastcgi_read_timeout 90s;
    }

    location /storage/ {
        alias /srv/storage/;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Vite output is content-hashed: cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /models/ {
        expires 30d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;
    }
}
