; Delivery-proof photos are validated at max 5 MB; leave headroom for the form.
upload_max_filesize = 10M
post_max_size = 12M
memory_limit = 256M
max_execution_time = 60
expose_php = Off

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Code is baked into the image, so never re-stat files.
opcache.validate_timestamps = 0
